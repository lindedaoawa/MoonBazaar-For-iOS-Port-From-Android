name: Android Release

on:
  push:
    tags:
      - 'android-v*'
      - 'androidlegacy-*'
      - 'Android-*'
      - 'MoonBazaar-*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要创建/更新的 Release tag（留空则只上传 artifact，不建 Release）'
        required: false
        default: ''
      release_name:
        description: 'Release 显示名称（留空则按 tag 推导为 MoonBazaar-<tag>）'
        required: false
        default: ''
      flavors:
        description: '要打包的 flavor（空格分隔，可选：arm_all / arm64 / arm32 / x8664）'
        required: false
        default: 'arm_all'

permissions:
  contents: write

jobs:
  release:
    name: Build APKs and publish
    runs-on: ubuntu-latest
    env:
      # 仅在配置了签名 Secrets 时才走自定义签名分支，否则回退到仓库演示签名
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" >/dev/null || true

      # ---------------------------------------------------------------
      # 确定 tag 与 Release 显示名：
      #   tag=Android-Legacy-Device-SP        -> MoonBazaar-Android-Legacy-Device-SP
      #   tag=MoonBazaar-Android-Legacy-...   -> 原样（不重复加前缀）
      #   tag=android-v1.0.0                  -> MoonBazaar-android-v1.0.0，versionName=1.0.0
      # ---------------------------------------------------------------
      - name: Determine release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_NAME: ${{ github.event.inputs.release_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi

          # Release 显示名：显式指定 > 由 tag 推导（已带前缀则不再重复）
          if [ -n "$INPUT_NAME" ]; then
            NAME="$INPUT_NAME"
          elif [ -n "$TAG" ]; then
            case "$TAG" in
              MoonBazaar-*|androidlegacy-*) NAME="$TAG" ;;
              *)                            NAME="MoonBazaar-$TAG" ;;
            esac
          else
            # 手动触发且未填 tag：仅上传 artifact，不建 Release
            NAME="MoonBazaar-android-dev"
          fi

          # versionName：tag 形如 android-v1.2.3 / androidlegacy-1.2.3 / v1.2.3 时取版本号，否则用 gradle.properties
          VER=""
          case "$TAG" in
            android-v[0-9]*)      VER="${TAG#android-v}" ;;
            androidlegacy-[0-9]*) VER="${TAG#androidlegacy-}" ;;
            v[0-9]*)              VER="${TAG#v}" ;;
          esac
          if [ -z "$VER" ]; then
            VER="$(sed -n 's/^VERSION_NAME=//p' gradle.properties | head -n1)"
            VER="${VER:-1.0.0}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "release tag: [$TAG]  name: [$NAME]  version: [$VER]"

      # 配置以下 Secrets 即可用自有证书签名，否则回退到仓库演示证书：
      #   ANDROID_KEYSTORE_BASE64     .jks 的 base64
      #   ANDROID_KEYSTORE_PASSWORD   keystore 密码
      #   ANDROID_KEY_ALIAS           key alias
      #   ANDROID_KEY_PASSWORD        key 密码
      - name: Build signed release APKs
        env:
          FLAVORS: ${{ github.event.inputs.flavors || 'arm_all' }}
          VERSION_NAME: ${{ steps.tag.outputs.ver }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SIGN_ARGS=(-PsignMode=demo)
          if [ -n "$KEYSTORE_B64" ]; then
            KS="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
            SIGN_ARGS=(
              -PsignMode=custom
              "-PstoreFile=$KS"
              "-PstorePassword=$KEYSTORE_PW"
              "-PkeyAlias=$KEY_ALIAS"
              "-PkeyPassword=$KEY_PW"
            )
            echo "使用自定义证书签名"
          else
            echo "未配置签名 Secrets，使用仓库演示证书签名"
          fi

          TASKS=()
          for f in $FLAVORS; do
            CAP="$(echo "$f" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
            TASKS+=("assemble${CAP}Release")
          done

          ./gradlew "${TASKS[@]}" "${SIGN_ARGS[@]}" \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="$VERSION_NAME" \
            --no-configuration-cache --stacktrace

      - name: Package APKs
        id: pkg
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ ! -d build/dist ] || [ -z "$(ls -A build/dist 2>/dev/null)" ]; then
            echo "未找到任何 APK，构建可能失败"
            exit 1
          fi
          for apk in build/dist/*.apk; do
            base="$(basename "$apk" .apk)"          # app-arm_all-release
            flavor="${base#app-}"; flavor="${flavor%-release}"; flavor="${flavor%-unsigned}"
            cp "$apk" "dist/${NAME}-${flavor}.apk"
          done
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MoonBazaar-android-release
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            KIND="已使用自有证书签名"
          else
            KIND="使用仓库演示证书签名（正式分发前请配置 Secrets 换用自有证书）"
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          MoonBazaar Android 客户端构建产物。

          - 安装要求：Android >= 6.0 (API 23)，覆盖 Android 10 以下的旧机型，同时兼容更高系统
          - 签名：$KIND
          - 包含 flavor：${{ github.event.inputs.flavors || 'arm_all' }}
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --title "$NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
