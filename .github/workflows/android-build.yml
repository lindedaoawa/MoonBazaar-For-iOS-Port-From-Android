name: Android Build

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'signature/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'signature/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      flavors:
        description: '要打包的 flavor（空格分隔，可选：arm_all / arm64 / arm32 / x8664）'
        required: false
        default: 'arm_all'

# 同一分支只保留最新一次构建
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build signed APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37：显式安装平台与 build-tools，缺失时由 AGP 兜底自动下载
      - name: Install SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" >/dev/null || true

      # 测试包使用仓库内置演示签名（signature/example.jks），保证 APK 可直接安装
      - name: Build release APKs
        env:
          FLAVORS: ${{ github.event.inputs.flavors || 'arm_all' }}
        run: |
          set -euo pipefail
          TASKS=""
          for f in $FLAVORS; do
            CAP="$(echo "$f" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
            TASKS="$TASKS assemble${CAP}Release"
          done
          echo "Gradle tasks:$TASKS"
          ./gradlew $TASKS -PsignMode=demo --no-configuration-cache --stacktrace

      - name: Show produced APKs
        run: ls -lh build/dist/ || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoonBazaar-android-apk
          path: build/dist/*.apk
          if-no-files-found: error
          retention-days: 30
