name: iOS Release

on:
  push:
    tags:
      - 'v*'
      - 'ios-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要创建/更新的 Release tag（留空则只上传 artifact，不建 Release）'
        required: false
        default: ''

permissions:
  contents: write

env:
  SCHEME: MoonBazaar
  PROJECT: MoonBazaar.xcodeproj
  PRODUCT: MoonBazaar.app

jobs:
  release:
    name: Build IPA and publish
    # 工程使用 Xcode 16 的 objectVersion 77 + PBXFileSystemSynchronizedRootGroup，
    # 必须跑在自带 Xcode 16 的镜像上。
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      # 仅在配置了签名 Secrets 时才走签名分支（空字符串 => 产出未签名 IPA）
      CERT_P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      # ---------------------------------------------------------------
      # 先确定 tag：发布包名由它决定（tag=ios-v1.0.0 -> MoonBazaar-ios-v1.0.0.ipa）
      # ---------------------------------------------------------------
      - name: Determine release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          if [ -n "$TAG" ]; then
            IPA_NAME="MoonBazaar-$TAG"
          else
            # 手动触发且未填 tag：仅上传 artifact，不建 Release，用工程版本命名
            MV=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' MoonBazaar.xcodeproj/project.pbxproj | head -n1)
            IPA_NAME="MoonBazaar-v${MV:-dev}-unsigned"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "release tag: [$TAG]  ipa: [$IPA_NAME]"

      # ---------------------------------------------------------------
      # 可选：配置以下 Secrets 即可产出已签名 IPA，否则产出未签名 IPA
      #   BUILD_CERTIFICATE_BASE64  .p12 的 base64
      #   P12_PASSWORD              .p12 密码
      #   PROVISIONING_PROFILE_BASE64 mobileprovision 的 base64
      #   KEYCHAIN_PASSWORD         临时钥匙串密码（任意值）
      #   DEVELOPMENT_TEAM          Apple Team ID
      # ---------------------------------------------------------------
      - name: Import signing assets
        if: env.CERT_P12 != ''
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$CERT_P12" | base64 --decode > "$CERT_PATH"
          printf '%s' "$PROFILE"  | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive (signed)
        if: env.CERT_P12 != ''
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/MoonBazaar.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

      - name: Build (Release, unsigned)
        if: env.CERT_P12 == ''
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package signed IPA
        if: env.CERT_P12 != ''
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
          IPA_NAME: ${{ steps.tag.outputs.ipa_name }}
        run: |
          set -euo pipefail
          mkdir -p dist build
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>method</key>' \
            '  <string>development</string>' \
            '  <key>teamID</key>' \
            "  <string>${TEAM_ID}</string>" \
            '  <key>signingStyle</key>' \
            '  <string>automatic</string>' \
            '  <key>stripSwiftSymbols</key>' \
            '  <true/>' \
            '  <key>compileBitcode</key>' \
            '  <false/>' \
            '</dict>' \
            '</plist>' > build/ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath build/MoonBazaar.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates

          mv "build/export/${SCHEME}.ipa" "dist/${IPA_NAME}.ipa"

      - name: Package unsigned IPA
        if: env.CERT_P12 == ''
        env:
          IPA_NAME: ${{ steps.tag.outputs.ipa_name }}
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/${PRODUCT}"
          mkdir -p dist/Payload
          rm -rf dist/Payload/* dist/*.ipa
          cp -R "$APP" dist/Payload/
          xattr -cr dist/Payload
          ( cd dist && zip -qry "${IPA_NAME}.ipa" Payload && rm -rf Payload )

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - name: Read artifact info
        id: ver
        run: |
          set -euo pipefail
          IPA=$(ls dist/*.ipa | head -n1)
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$IPA" .ipa)" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: MoonBazaar-ipa-release
          path: ios/dist/*.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          IPA: ${{ steps.ver.outputs.ipa }}
          ARTIFACT: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          if [ -n "$CERT_P12" ]; then
            KIND="已签名 IPA（development）—— 需设备 UDID 已加入对应 Provisioning Profile"
          else
            KIND="未签名 IPA —— 需用 TrollStore / AltStore / Sideloadly 等工具重签后安装"
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          MoonBazaar iOS 客户端构建产物。

          - 安装要求：iOS >= 15.0，arm64 设备
          - 包类型：$KIND
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" --title "MoonBazaar-$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi